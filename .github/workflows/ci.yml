name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -q test
      # Framework integrations (Ktor, Quarkus, Micronaut) build against the SDK just compiled above.
      - run: mvn -B -q install -DskipTests
      - run: mvn -B test
        working-directory: integrations
